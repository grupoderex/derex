services:
  traefik:
    profiles:
      - qa-only

  frontend:
    build:
      dockerfile: Dockerfile.local
      args:
        NEXT_PUBLIC_REACT_APP_BACKEND_URL: http://localhost:3001
        NEXT_PUBLIC_REACT_APP_BLOG_URL: http://localhost:1337
        NEXT_PUBLIC_REACT_APP_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_REACT_APP_GOOGLE_MAPS_KEY}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        SITE_URL: http://localhost:3000
    environment:
      BACKEND_URL: http://backend:3000
      BLOG_URL: http://blog:1337
      NEXT_PUBLIC_REACT_APP_BACKEND_URL: http://localhost:3001
      NEXT_PUBLIC_REACT_APP_BLOG_URL: http://localhost:1337
      NEXT_PUBLIC_REACT_APP_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_REACT_APP_GOOGLE_MAPS_KEY}
      NEXT_PUBLIC_ENABLE_GOOGLE_MAPS_DEV: ${NEXT_PUBLIC_ENABLE_GOOGLE_MAPS_DEV:-false}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    ports:
      - "3000:3000"

  backend:
    environment:
      JWT_SECRET: local_jwt_secret_min_32_chars_change_me
      TOKEN_SECRET: local_token_secret_change_me
      TOKEN_SECRET_2: local_token_secret_2_change_me
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      RECAPTCHA_BYPASS: ${RECAPTCHA_BYPASS:-false}
      DISABLE_CRON_JOBS: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./derex-backend-master/uploads:/app/uploads

  admin:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:3001
        VITE_FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:80"

  blog:
    build:
      dockerfile: Dockerfile.local
    environment:
      NODE_ENV: development
      STRAPI_BOOTSTRAP_ADMIN_FIRSTNAME: Admin
      STRAPI_BOOTSTRAP_ADMIN_LASTNAME: Local
      STRAPI_BOOTSTRAP_ADMIN_EMAIL: admin.local@javer.com
      STRAPI_BOOTSTRAP_ADMIN_PASSWORD: Admin123!
    ports:
      - "1337:1337"
