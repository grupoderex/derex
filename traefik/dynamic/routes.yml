http:
  routers:
    # ── Javer QA Frontend (apex + www) ───────────────────────────────────────
    javerqa-frontend-http:
      rule: 'Host(`javerqa.online`) || Host(`www.javerqa.online`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: javerqa-frontend

    javerqa-frontend-apex:
      rule: 'Host(`javerqa.online`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: 'javerqa.online'
            sans:
              - 'www.javerqa.online'
      service: javerqa-frontend

    javerqa-frontend-www:
      rule: 'Host(`www.javerqa.online`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: 'www.javerqa.online'
            sans:
              - 'javerqa.online'
      middlewares: [www-to-root]
      service: javerqa-frontend

    # ── Javer QA Backend API ─────────────────────────────────────────────────
    javerqa-backend-http:
      rule: 'Host(`api.javerqa.online`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: javerqa-backend

    javerqa-backend:
      rule: 'Host(`api.javerqa.online`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: javerqa-backend

    # ── Javer QA Admin panel ─────────────────────────────────────────────────
    javerqa-admin-http:
      rule: 'Host(`admin.javerqa.online`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: javerqa-admin

    javerqa-admin:
      rule: 'Host(`admin.javerqa.online`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: javerqa-admin

    # ── Javer QA Blog (Strapi) ───────────────────────────────────────────────
    javerqa-blog-http:
      rule: 'Host(`blog.javerqa.online`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: javerqa-blog

    javerqa-blog:
      rule: 'Host(`blog.javerqa.online`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: javerqa-blog

    # ── Frontend (apex + www) ─────────────────────────────────────────────────
    frontend-http:
      rule: 'Host(`{{ env "DOMAIN" }}`) || Host(`www.{{ env "DOMAIN" }}`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: frontend

    frontend-apex:
      rule: 'Host(`{{ env "DOMAIN" }}`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: '{{ env "DOMAIN" }}'
            sans:
              - 'www.{{ env "DOMAIN" }}'
      service: frontend

    frontend-www:
      rule: 'Host(`www.{{ env "DOMAIN" }}`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: 'www.{{ env "DOMAIN" }}'
            sans:
              - '{{ env "DOMAIN" }}'
      middlewares: [www-to-root]
      service: frontend

    # ── Backend API ───────────────────────────────────────────────────────────
    backend-http:
      rule: 'Host(`api.{{ env "DOMAIN" }}`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: backend

    backend:
      rule: 'Host(`api.{{ env "DOMAIN" }}`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: backend

    # ── Admin panel ───────────────────────────────────────────────────────────
    admin-http:
      rule: 'Host(`admin.{{ env "DOMAIN" }}`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: admin

    admin:
      rule: 'Host(`admin.{{ env "DOMAIN" }}`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: admin

    # ── Blog (Strapi) ─────────────────────────────────────────────────────────
    blog-http:
      rule: 'Host(`blog.{{ env "DOMAIN" }}`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: blog

    blog:
      rule: 'Host(`blog.{{ env "DOMAIN" }}`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: blog

    # ── Javer Querétaro landing API (host process) ───────────────────────────
    javer-queretaro-http:
      rule: 'Host(`api.javer-queretaro.com`)'
      entrypoints: [web]
      middlewares: [https-redirect]
      service: javer-queretaro

    javer-queretaro:
      rule: 'Host(`api.javer-queretaro.com`)'
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: 'api.javer-queretaro.com'
      service: javer-queretaro

  middlewares:
    www-to-root:
      redirectRegex:
        regex: '^https://www\.(.+)'
        replacement: 'https://${1}'
        permanent: true

  services:
    javerqa-frontend:
      loadBalancer:
        servers:
          - url: 'http://javerqa-frontend-1:3000'

    javerqa-backend:
      loadBalancer:
        servers:
          - url: 'http://javerqa-backend-1:3000'

    javerqa-admin:
      loadBalancer:
        servers:
          - url: 'http://javerqa-admin-1:80'

    javerqa-blog:
      loadBalancer:
        servers:
          - url: 'http://javerqa-blog-1:1337'

    frontend:
      loadBalancer:
        servers:
          - url: 'http://derex-frontend-1:3000'

    backend:
      loadBalancer:
        servers:
          - url: 'http://derex-backend-1:3000'

    admin:
      loadBalancer:
        servers:
          - url: 'http://derex-admin-1:80'

    blog:
      loadBalancer:
        servers:
          - url: 'http://derex-blog-1:1337'

    javer-queretaro:
      loadBalancer:
        servers:
          - url: 'http://172.18.0.1:3000'
