services:
  frontend-local:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_REACT_APP_BACKEND_URL: http://localhost:3001
      NEXT_PUBLIC_REACT_APP_BLOG_URL: http://localhost:1337
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./derex-frontend-main:/app
      - frontend_local_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  frontend_local_node_modules:
